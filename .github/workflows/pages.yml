name: Deploy question bank
on:
  push:
    branches: [main]
    paths: ['site-part-*.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack static website
        run: |
          mkdir -p _site
          for archive in site-part-*.zip; do unzip -q -o "$archive" -d _site; done
          test -s _site/index.html
          test "$(find _site/pages -name '*.png' | wc -l)" -eq 292
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

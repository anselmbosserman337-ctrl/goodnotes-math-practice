name: Deploy question bank
on:
  push:
    branches: [main]
    paths: ['site-part-*.zip', 'updates/**', 'optimize_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack static website
        run: |
          mkdir -p _site
          for archive in site-part-*.zip; do unzip -q -o "$archive" -d _site; done
          for archive in updates/*/*.zip; do unzip -q -o "$archive" -d _site; done
          test -s _site/index.html
          test "$(find _site/pages -name '*.png' | wc -l)" -eq "$(python3 -c 'import json; print(len(json.load(open("monitor/reviewed.json"))["pages"]))')"
          touch _site/.nojekyll
      - name: Optimize initial rendering and font caching
        run: python3 optimize_site.py _site
      - id: package
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ steps.package.outputs.name }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
